  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.4"/></svg>일정</button>
  <button data-tab="routine"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12.5 3 3 5.5-6.5"/></svg>루틴</button>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD='일월화수목금토';
const fmtDate=s=>{const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`};
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return `${h<12?'오전':'오후'} ${h%12||12}시${m?` ${m}분`:''}`};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};

const SKINS=[['airport','공항'],['stationery','공책'],['yellow','노랑'],['dots','물방울'],['stars','별'],['stripes','줄무늬'],['pastel','파스텔'],['sweet','리본·체리']];
const PATTERNED=['airport','dots','stars','stripes','sweet'];
function applySkin(k){k=SKINS.some(x=>x[0]===k)?k:'airport';const h=document.documentElement;if(h.dataset.skin!==k){h.dataset.skin=k;h.classList.toggle('patterned',PATTERNED.includes(k));ls.set('hb-skin',k)}}
applySkin(ls.get('hb-skin'));
let CODE=ls.get('hb-code'), DOC=null, TAB=ls.get('hb-tab')||'today', KID=ls.get('hb-kid')==='1', ME=ls.get('hb-me');
let calMonth=null, selDay=ymd(new Date()), editStatus=null, lastErr='';

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

/* ---------- 서버 ---------- */
async function call(op,p,pin){
  const r=await fetch('/api/family',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:CODE,op,p,pin})});
  const data=await r.json().catch(()=>({error:'서버 응답을 읽지 못했어요'}));
  if(!r.ok)throw new Error(data.error||'저장하지 못했어요');
  return data;
}
async function act(op,p,msg,pin){
  try{DOC=await call(op,p,pin);render();if(msg)toast(msg)}
  catch(e){toast(e.message)}
}

/* ---------- 부모 PIN ---------- */
// 잠금을 풀면 이 탭에서 10분 동안 어른 화면·설정을 쓸 수 있다. PIN 숫자는 기기에 저장하지 않고 메모리에만 둔다.
let PIN=null,PIN_AT=0;
const unlocked=()=>!DOC?.hasPin||(PIN&&Date.now()-PIN_AT<10*60e3);
function lockNow(){PIN=null;PIN_AT=0}
function pinPad(title,sub){
  return new Promise(resolve=>{
    const el=$('#pinlock');let v='';
    const draw=(err='')=>{el.innerHTML=`<div class="pinbox" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="pin-ic">🔒</div><h2>${esc(title)}</h2><p class="pin-sub">${esc(sub||'')}</p>
      <div class="pin-dots" aria-live="polite">${[0,1,2,3,4,5].map(i=>`<i class="${i<v.length?'on':''}${i>=4?' opt':''}"></i>`).join('')}</div>
      <p class="pin-err" role="alert">${esc(err)}</p>
      <div class="pin-keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" aria-label="취소" class="sm">취소</button><button data-k="0">0</button><button data-k="b" aria-label="지우기" class="sm">⌫</button></div>
      <button class="btn primary block" id="pinOk" ${v.length<4?'disabled':''}>확인</button></div>`};
    const close=val=>{el.hidden=true;el.innerHTML='';document.removeEventListener('keydown',kd);resolve(val)};
    const press=async k=>{
      if(k==='x')return close(null);
      if(k==='b'){v=v.slice(0,-1);return draw()}
      if(k==='ok'){if(v.length>=4)close(v);return}
      if(/^\d$/.test(k)&&v.length<6){v+=k;draw();try{navigator.vibrate?.(8)}catch(e){}}
    };
    const kd=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('b');else if(e.key==='Enter')press('ok');else if(e.key==='Escape')press('x')};
    el.onclick=e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k);else if(e.target.id==='pinOk')press('ok')};
    document.addEventListener('keydown',kd);
    el.hidden=false;draw();el.showErr=msg=>{v='';draw(msg)};
  });
}
// PIN이 없으면 바로 통과. 있으면 숫자판을 띄우고 서버에서 맞는지 확인한다.
async function pinGate(title='어른 확인',sub='부모 PIN을 눌러 주세요'){
  if(unlocked())return true;
  for(;;){
    const v=await pinPad(title,sub);if(v==null)return false;
    try{await call('checkPin',{},v);PIN=v;PIN_AT=Date.now();return true}
    catch(e){toast(e.message);sub=e.message}
  }
}
async function load(quiet){
  if(!CODE)return;
  try{
    const r=await fetch('/api/family?code='+encodeURIComponent(CODE),{cache:'no-store'});
    const data=await r.json();
    if(r.status===404){ls.set('hb-code',null);CODE=null;DOC=null;render();toast('가족을 찾을 수 없어서 처음 화면으로 돌아왔어요');return}
    if(!r.ok)throw new Error(data.error);
    const changed=!DOC||DOC.rev!==data.rev;DOC=data;lastErr='';
    if(changed&&!(quiet&&isTyping()))render();
  }catch(e){lastErr='연결이 끊겼어요. 잠시 뒤 다시 시도할게요.';if(!quiet)render()}
}
const isTyping=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='SELECT')};
setInterval(()=>{if(document.visibilityState==='visible')load(true)},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load(true)});

/* ---------- 도움 함수 ---------- */
const member=id=>DOC.members.find(m=>m.id===id);
const child=()=>DOC.members.find(m=>m.role==='child');
const childName=()=>child()?.name||'아이';
function eventsOn(day){
  const d=parse(day);
  return DOC.events.filter(e=>{
    if(e.date>day)return false;
    if(e.repeat==='weekly')return parse(e.date).getDay()===d.getDay();
    if(e.repeat==='yearly')return e.date.slice(5)===day.slice(5);
    return day===e.date||(e.endDate&&day<=e.endDate);
  }).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
}
function whoText(e){if(!e.who||!e.who.length||e.who.includes('all'))return'가족 모두';return e.who.map(id=>member(id)?.name).filter(Boolean).join(', ')}
const STATE={home:['🏠','집에 있어요'],out:['🚶','밖에 있어요'],coming:['🚗','집에 오는 중'],school:['🏫','학교'],kinder:['🧸','유치원'],work:['💼','회사']};
function statusOf(m){const s=DOC.status[m.id];if(!s||ymd(new Date(s.at))!==ymd(new Date()))return null;return s}
function statusText(s){if(!s)return'아직 안 알려줬어요';const[e,t]=STATE[s.state]||STATE.home;
  return `${e} ${t}${s.eta?` · ${fmtTime(s.eta)}${s.state==='coming'?' 도착':'에 와요'}`:''}${s.note?` · ${esc(s.note)}`:''}`}
function routinesFor(day){const wd=parse(day).getDay();return DOC.routines.filter(r=>r.days.includes(wd))}
function upcoming(days=45){
  const out=[];const t=new Date();
  for(let i=1;i<=days;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);const s=ymd(d);
    for(const e of eventsOn(s))if(e.repeat!=='weekly'&&(e.date===s||e.repeat==='yearly'))out.push({e,day:s,dd:i})}
  return out.slice(0,8);
}
const ddayText=n=>n===1?'내일':`${n}일 뒤`;

/* ---------- 그리기 ---------- */
function render(){
  document.body.classList.toggle('kid',!!(DOC&&KID));
  $('#top').hidden=!DOC||KID||TAB==='today';$('#tabs').hidden=!DOC||KID;
  if(!CODE||!DOC){if(CODE&&!DOC){app.innerHTML=lastErr?`<div class="empty" style="padding-top:80px"><p>${esc(lastErr)}</p><button class="btn primary" id="retryLoad">다시 불러오기</button></div>`:'<p class="empty" style="padding-top:80px">우리집 보드를 불러오는 중이에요…</p>';if($('#retryLoad'))$('#retryLoad').onclick=()=>{lastErr='';render();load()};return}return renderStart()}
  document.title=DOC.name+' 보드';applySkin(DOC.skin);
  $('#famName').textContent=DOC.name;
  $('#kidBtn').textContent=childName()+' 보드';
  if(KID)return renderKid();
  $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===TAB));
  if(!['today','plan','routine','notes','study','play','settings'].includes(TAB))TAB='today';
  $('#pageTitle').textContent={today:'오늘',plan:'일정',routine:'루틴',notes:'한마디',study:'공부',play:'놀이터',settings:'설정'}[TAB];
  ({today:renderToday,plan:renderPlan,routine:renderRoutine,notes:renderNotes,study:renderStudy,play:renderPlay,settings:renderSettings})[TAB]();
  if(lastErr)app.insertAdjacentHTML('afterbegin',`<p class="card" style="color:var(--warm)">${lastErr}</p>`);
}
$('#tabs').onclick=async e=>{const b=e.target.closest('[data-tab]');if(!b)return;
  if(b.dataset.tab==='settings'&&!unlocked()&&!(await pinGate('설정 열기')))return;
  TAB=b.dataset.tab;ls.set('hb-tab',TAB);editStatus=null;closeSheet();render();window.scrollTo(0,0)};
$('#kidBtn').onclick=()=>{closeSheet();KID=true;ls.set('hb-kid','1');lockNow();render();window.scrollTo(0,0)};

/* 처음 화면 */
function renderStart(){
  app.innerHTML=`<section class="hero"><h1>우리집 보드</h1><p>가족 일정과 픽업, 아이 루틴, 한마디, 공부방을 한곳에서 함께 봐요.</p></section>
  <div class="card"><h3>새로 시작하기</h3>
    <label class="l" for="sName">가족 이름</label><input class="input" id="sName" value="세윤이네" maxlength="20">
    <label class="l">가족 구성원 (나중에 설정에서 바꿀 수 있어요)</label>
    <div class="chips" id="sMembers"></div>
    <div class="row" style="margin-top:10px"><input class="input grow" id="sNew" placeholder="예: 할머니" maxlength="12"><button class="btn" id="sAdd">추가</button></div>
    <p style="margin-top:14px"><button class="btn primary block" id="sCreate">우리집 보드 만들기</button></p></div>
  <div class="card"><h3>가족이 이미 만들었어요</h3>
    <p class="sub" style="color:var(--muted);margin:0 0 8px">가족에게 받은 코드를 넣어 주세요.</p>
    <div class="row"><input class="input grow" id="jCode" placeholder="ABCD-1234" maxlength="9" autocapitalize="characters" autocomplete="off"><button class="btn primary" id="jGo">들어가기</button></div></div>
  <details class="card"><summary><b>지운 보드 되살리기</b> <small style="color:var(--muted)">(지운 뒤 30일까지)</small></summary>
    <div class="row" style="margin-top:10px"><input class="input grow" id="rCode" placeholder="ABCD-1234" maxlength="9" autocapitalize="characters" autocomplete="off" value="${esc(ls.get('hb-last-deleted')||'')}"><button class="btn" id="rGo">되살리기</button></div>
    <p style="color:var(--muted);font-size:14px;margin:8px 0 0">PIN을 정해 두었던 보드는 PIN을 물어봐요.</p></details>`;
  const mem=[{name:'엄마',emoji:'👩',role:'adult'},{name:'아빠',emoji:'👨',role:'adult'},{name:'세윤',emoji:'🧒',role:'child'}];
  const draw=()=>{$('#sMembers').innerHTML=mem.map((m,i)=>`<button class="chip on" data-i="${i}">${m.emoji} ${esc(m.name)} ✕</button>`).join('')};
  draw();
  $('#sMembers').onclick=e=>{const c=e.target.closest('[data-i]');if(c){mem.splice(+c.dataset.i,1);draw()}};
  $('#sAdd').onclick=()=>{const v=$('#sNew').value.trim();if(!v)return;const emo=/할머니/.test(v)?'👵':/할아버지/.test(v)?'👴':/이모|고모|언니|누나/.test(v)?'👩':/삼촌|형|오빠/.test(v)?'👨':'🙂';mem.push({name:v,emoji:emo,role:'adult'});$('#sNew').value='';draw()};
  $('#sCreate').onclick=async()=>{
    try{const r=await fetch('/api/family',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({op:'create',p:{name:$('#sName').value,members:mem}})});
      const data=await r.json();if(!r.ok)throw new Error(data.error);
      CODE=data.code;DOC=data.doc;ls.set('hb-code',CODE);TAB='today';render();toast('우리집 보드를 만들었어요');
    }catch(e){toast(e.message||'만들지 못했어요')}};
  $('#jGo').onclick=()=>join($('#jCode').value);
  $('#rGo').onclick=async()=>{const c=String($('#rCode').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==8)return toast('코드는 8자리예요');
    const code=c.slice(0,4)+'-'+c.slice(4);
    const tryRestore=async pin=>{const r=await fetch('/api/family',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,op:'restoreFamily',pin})});return{r,d:await r.json()}};
    try{let{r,d}=await tryRestore();
      if(r.status===403){const pin=await pinPad('PIN 확인','이 보드의 부모 PIN을 눌러 주세요');if(pin==null)return;({r,d}=await tryRestore(pin))}
      if(!r.ok)throw new Error(d.error);
      CODE=code;DOC=d;ls.set('hb-code',CODE);ls.set('hb-last-deleted',null);TAB='today';render();toast('우리집 보드를 되살렸어요')}catch(e){toast(e.message)}};
}
async function join(raw){
  const c=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==8){toast('코드는 8자리예요');return}
  CODE=c.slice(0,4)+'-'+c.slice(4);ls.set('hb-code',CODE);DOC=null;render();await load();
  if(DOC)toast(DOC.name+' 보드에 들어왔어요');
}

// 장소마다 자석 자리 (그림 좌표 360×230)
const ZONES={unknown:[[42,36],[74,36],[106,36],[138,36],[58,62],[122,62]],home:[[52,182],[142,182],[97,140],[52,140],[142,140],[97,182]],
  coming:[[300,214],[256,214],[212,214],[168,214]],school:[[230,168],[258,188]],kinder:[[244,190],[226,186]],work:[[302,168],[332,190]],out:[[186,182],[206,176],[176,160]]};
const ZONE_NAME={unknown:'어디 있는지 몰라요',home:'집에 있어요',coming:'집에 오는 중',school:'학교에 있어요',kinder:'유치원에 있어요',work:'회사',out:'밖에 있어요'};
function sceneHtml(interactive){
  const groups={};DOC.members.forEach((m,i)=>{const s=statusOf(m);(groups[s?s.state:'unknown']||=[]).push({m,i,s})});
  let pins='';
  for(const[z,list]of Object.entries(groups))list.forEach((o,k)=>{
    const spots=ZONES[z]||ZONES.unknown,[x,y]=spots[k%spots.length],off=Math.floor(k/spots.length)*10;
    const tag=z==='unknown'?'?':o.s?.eta||'';

});

// 공부 리포트: 연속 공부, 오늘 목표, 최근 7일
function studyReport(days,total){
  const P=Progress,sk=P.streak(DOC),done=P.doneToday(DOC),goal=DOC.goal?.subjects||2,learn=DOC.learn||{};
  const maxS=Math.max(5,...days.map(x=>DOC.study[x.s]||0));
  const bars=days.map(x=>{const n=DOC.study[x.s]||0,rounds=Object.values(learn[x.s]||{}).reduce((a,v)=>a+v.n,0);
    return `<div class="dbar"><span class="bv">${n||''}</span><span class="bb"><i style="height:${Math.round(n/maxS*100)}%"></i></span><span class="bd">${WD[x.d.getDay()]}</span><small>${rounds?rounds+'판':'-'}</small></div>`}).join('');
  return `<div class="card report"><h3>📊 ${esc(childName())} 공부 리포트</h3>
    <div class="rep-top"><div><b>🔥 ${sk}일</b><small>연속 공부</small></div><div class="${done.length>=goal?'met':''}"><b>${Math.min(done.length,4)}/${goal}</b><small>오늘 목표 과목</small></div><div><b>★ ${total}</b><small>이번 주 별</small></div></div>
    <h4>최근 7일 <small>별 · 푼 판 수</small></h4><div class="bars">${bars}</div>
    <h4>오늘 목표</h4><div class="chips" id="goalChips">${[1,2,3,4].map(n=>`<button class="chip${n===goal?' on':''}" data-g="${n}">과목 ${n}개</button>`).join('')}</div>
    <p style="color:var(--muted);font-size:14px;margin:10px 0 0">공부방 첫 화면에 오늘 목표와 연속 공부 날이 보여요. 틀린 문제는 그 놀이의 다음 판에 먼저 다시 나와요. 가족 모두의 화면에 같이 보여요.</p></div>`;
}

}

/* 아이 보드 */
const SAY=[['🍚','배고파요'],['✅','다 했어요'],['💗','보고 싶어요'],['🙋','도와주세요'],['🥱','심심해요'],['🚽','화장실 가요']];
function renderKid(){
  const day=ymd(new Date()),rs=routinesFor(day),ch=child();
  const KSAY={coming:'집에 오는 중',work:'회사에 있어요',school:'학교에 있어요',kinder:'유치원에 있어요',out:'밖에 있어요',home:'집에 있어요',unknown:'아직 몰라요'};
  const arr=DOC.members.filter(m=>m.role!=='child').map(m=>{const i=DOC.members.indexOf(m),s=statusOf(m),k=s?s.state:'unknown';return{m,i,s,k,o:ARR[k][2]}})
    .sort((a,b)=>a.o-b.o||(a.s?.eta||'99').localeCompare(b.s?.eta||'99'));
  app.innerHTML=`
  <header class="fids-top kid-top">
    <span class="ft-eye">${esc(ch?.name||'')} BOARD · 오늘도 신나게!</span>
    <button class="ft-kid" id="adultBtn">어른 화면</button>
    <h1 class="ft-name">${esc(ch?.name||'')}${ch?'아, ':''}안녕!</h1>
    <div class="ft-r"><span class="t" id="clk"></span><span class="ft-date">${fmtDate(day)}</span></div>
  </header>
  <section class="fids kid-arr">
    <h2 class="fids-h">${PLANE_IN}<span>도착</span><small>ARRIVALS · 누가 언제 와요?</small></h2>
    ${arr.map(({m,i,s,k})=>`<div class="fids-row">
      <span class="fr-time">${s?.eta||'--:--'}</span>
      <span class="fr-main"><span class="fr-av" style="--c:var(--m${i%6})">${esc(m.emoji)}</span><b>${esc(m.name)}</b><small>${KSAY[k]}${s?.eta&&k!=='home'?` · ${fmtTime(s.eta)}${k==='coming'?' 도착':'에 와요'}`:''}</small></span>
      <span class="fr-st ${ARR[k][1]}">${ARR[k][0]}</span></div>`).join('')}
  </section>
  <div class="card"><h3>오늘 할 일</h3>${rs.length?`<div class="rlist">${rs.map(r=>`<button class="rbtn${DOC.checks[day]?.[r.id]?' done':''}" data-r="${r.id}"><span class="e">${esc(r.emoji)}</span>${esc(r.title)}</button>`).join('')}</div>`:'<p class="empty">오늘은 할 일이 없어요!</p>'}</div>
  <div class="two"><a class="bigstudy" href="/study.html">✏️ 공부방 <span style="font-size:20px">★ ${DOC.study[day]||0}</span></a><a class="bigstudy play" href="/games.html">✈️ 놀이터</a></div>
  <div class="card"><h3>🍇 내 포도송이 ${stickers().board.length} / ${Grapes.GOAL}</h3>${todayStickers()}${Grapes.svg(stickers().board)}
    ${stickers().gift?`<p class="giftline">다 채우면 🎁 ${esc(stickers().gift)}</p>`:''}</div>
  <div class="card"><h3>엄마 아빠에게 말하기</h3><div class="say">${SAY.map(([e,t])=>`<button data-say="${t}">${e} ${t}</button>`).join('')}</div></div>
  <div class="notes">${DOC.notes.filter(n=>!n.kid).slice(0,2).map(noteItem).join('')}</div>`;
  tick();
  $('#adultBtn').onclick=async()=>{if(!(await pinGate('어른 화면으로 갈게요','부모 PIN을 눌러 주세요')))return;
    KID=false;ls.set('hb-kid',null);render();window.scrollTo(0,0);if(!DOC.hasPin)toast('설정에서 부모 PIN을 정하면 아이가 어른 화면을 못 열어요')};
  $$('.rbtn').forEach(b=>b.onclick=()=>act('toggleCheck',{date:day,rid:b.dataset.r},b.classList.contains('done')?'':'잘했어요! ✓'));
  $$('[data-say]').forEach(b=>b.onclick=()=>act('addNote',{from:ch?.name||'아이',text:b.dataset.say,kid:true},'엄마 아빠에게 보냈어요'));
}

/* ---------- 시작 ---------- */
(async()=>{
  const jp=new URLSearchParams(location.search).get('join');
  if(jp){history.replaceState(null,'',location.pathname);await join(jp);return}
  render();await load();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
