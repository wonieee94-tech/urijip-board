<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세윤이 놀이터</title>
<meta name="theme-color" content="#14171D">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/skins.css">
<style>
/* 놀이터: 공항 표지판 틀 위에 지도·활주로·여행 놀이 */
main.wrap{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.gtop{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.gtop a,.gtop button{text-decoration:none;color:var(--sign-ink);background:var(--sign);border:0;box-shadow:var(--shadow-sm);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
.gtop h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,5.6vw,30px);flex:1;min-width:0}
.hub{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.hub{grid-template-columns:1fr 1fr 1fr}}
.gcard{border:1px solid var(--hair);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);overflow:hidden;padding:0;text-align:left;display:flex;flex-direction:column}
.gcard .art{height:150px;display:grid;place-items:center;font-size:56px;text-shadow:0 4px 14px rgba(0,0,0,.35)}
.gcard b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;padding:12px 14px 0}
.gcard span{display:block;color:var(--muted);font-size:15px;padding:2px 14px 14px}
.gcard:active{transform:translateY(1px);box-shadow:var(--shadow-sm)}

/* 세계 지도 */
.mapwrap{background:#9ED3F5;border:0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);position:relative}
#map{display:block;width:100%;height:auto;touch-action:manipulation}
.mapscroll{overflow:auto;-webkit-overflow-scrolling:touch;aspect-ratio:1000/503;touch-action:pan-x pan-y}
#map{display:block;height:auto}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--hair);background:#fff;color:#111318;font-size:24px;font-weight:700;box-shadow:var(--shadow-sm)}
#map{min-width:100%}
#map .ocean{fill:#CFE8F7}
#map .c{stroke:#fff;stroke-width:.7;stroke-linejoin:round}
#map .c0{fill:#F6D776}#map .c1{fill:#A6DBA9}#map .c2{fill:#F5B0C0}#map .c3{fill:#A9C9F2}#map .c4{fill:#F4BB86}#map .c5{fill:#CDB8EB}
#map .c.kr{fill:#FF7A45;stroke:#111318;stroke-width:1.2}
#map .night{fill:#14204A;opacity:.33;pointer-events:none}
#map .sun{fill:#FFD34E;stroke:#E7A800;stroke-width:2}
#map .oceans text{font-size:15px;font-style:italic;letter-spacing:.3em;fill:#5C86A8;text-anchor:middle;pointer-events:none}
#map .cpin circle{fill:#E5512D;stroke:#fff;stroke-width:1}
#map .cpin.on circle{fill:#FFC72C;stroke:#111;stroke-width:1.2}
#map .cpin .hit{fill:transparent;stroke:none}
#map .cpin text{font-size:11px;font-weight:700;fill:#111318;paint-order:stroke;stroke:#fff;stroke-width:3px;text-anchor:middle}
.legend2{display:flex;gap:14px;justify-content:center;font-size:14px;color:var(--muted);margin:8px 0 0}
.legend2 i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--plate)}
.city{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.city .ana{width:120px;height:120px}
.ana circle.face{fill:var(--card);stroke:var(--plate);stroke-width:3}
.ana.nightc circle.face{fill:#1B2A57}
.ana line{stroke:var(--plate);stroke-linecap:round}
.ana.nightc line{stroke:#FFC72C}
.ana .tick{stroke-width:2}
.ana.nightc .tick{stroke:#9AA3B2}
.city .nm{font-family:var(--f-display);font-size:24px;line-height:1.1}
.city .dg{font-family:var(--f-display);font-size:30px;color:var(--warm);line-height:1.1}
.city .diff{font-size:17px;margin-top:4px}
.city .diff b{color:var(--blue)}
.city .row{grid-column:1/-1}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cities button{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:10px;text-align:left;font-size:15px;box-shadow:var(--shadow-sm)}
.cities button b{display:block;font-size:17px}
.cities button .t{font-family:var(--f-display);font-size:22px;color:var(--warm)}
.cities button.on{background:var(--sign);color:var(--sign-ink)}

/* 비행 놀이 */
.stage2{position:relative;border:0;border-radius:var(--r) var(--r) 0 0;overflow:hidden;box-shadow:var(--shadow);background:#9FD3FF;touch-action:none;-webkit-user-select:none;user-select:none}
.stage2 canvas{display:block;width:100%;height:auto;touch-action:none}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.hudbox{background:rgba(20,23,29,.78);color:#EEF1F6;border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700;line-height:1.3}
.hudbox .v{font-family:var(--f-display);font-size:20px;color:#FFC72C;font-weight:400}
.hudbtns{display:flex;gap:6px;pointer-events:auto}
.hudbtns button{width:40px;height:40px;border-radius:12px;border:0;background:rgba(20,23,29,.78);color:#fff;font-size:18px}
.prog{width:min(40vw,220px);height:10px;border-radius:5px;background:#2A303C;position:relative;margin-top:4px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#FFC72C;border-radius:5px}
.msg{position:absolute;inset:0;display:flex;overflow-y:auto;overscroll-behavior:contain;background:rgba(20,23,29,.55);text-align:center;padding:12px;z-index:3}
.msg .box{background:var(--card);color:var(--ink);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;max-width:420px;width:100%;margin:auto}
@media(max-width:480px){.msg{padding:8px}.msg .box{padding:10px 12px}.msg .box h3{font-size:20px}.msg .stars3{font-size:26px}.msg .tut-ill{font-size:34px}.msg .box p{margin:2px 0 6px;font-size:14px}.msg .box .btn{padding:9px 14px;font-size:15px}}
.msg .box h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin-bottom:4px}
.msg .box p{margin:4px 0 10px}
.msg .stars3{font-size:34px;letter-spacing:4px;margin:2px 0}
.msg .stars3 .off{filter:grayscale(1);opacity:.3}
.msg .tut-ill{font-size:44px;line-height:1.1;margin:4px 0}
.msg .tut-dots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}.msg .tut-dots i{width:8px;height:8px;border-radius:50%;background:var(--hair)}.msg .tut-dots i.on{background:var(--warm)}
.helptxt{color:var(--muted);font-size:15px;margin:10px 2px 0}
.newbest{display:inline-block;background:var(--sign);color:var(--sign-ink);border-radius:999px;padding:1px 10px;font-weight:700;font-size:14px}

/* 조종석 계기판 */
.cockpit{display:grid;grid-template-columns:96px 1fr 104px;gap:10px;align-items:stretch;background:linear-gradient(#2A2F3A,#171A21);border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);padding:12px 10px 14px;color:#E9EDF5;touch-action:none;-webkit-user-select:none;user-select:none;position:relative}
.cockpit.auto::after{content:attr(data-auto);position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,18,24,.72);border-radius:0 0 var(--r) var(--r);font-weight:700;font-size:18px;color:#FFC72C}
.cp-col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cp-lbl{font-size:13px;font-weight:700;color:#AEB6C6;letter-spacing:.04em}
.cp-val{font-family:var(--f-display);font-size:18px;color:#FFC72C}
.thr-track{position:relative;width:64px;height:190px;border-radius:14px;background:#0E1015;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);cursor:grab;touch-action:none}
.thr-slot{position:absolute;left:50%;top:14px;bottom:14px;width:10px;margin-left:-5px;border-radius:5px;background:#000;box-shadow:inset 0 0 0 1px #333}
.thr-fill{position:absolute;left:50%;bottom:14px;width:10px;margin-left:-5px;border-radius:5px;background:linear-gradient(#FF8A3D,#FFC72C)}
.thr-mark{position:absolute;left:2px;right:2px;height:0;border-top:2px dashed #4A5162;font-size:10px;color:#8D96A8;text-align:left;pointer-events:none}
.thr-mark span{position:absolute;top:-15px;left:0;white-space:nowrap}
.thr-handle{position:absolute;left:4px;right:4px;height:34px;margin-top:-17px;border-radius:10px;background:linear-gradient(#5B6475,#373D4A);border:2px solid #111;box-shadow:0 3px 0 #000;display:grid;place-items:center;pointer-events:none}
.thr-handle i{width:70%;height:8px;border-radius:4px;background:linear-gradient(90deg,#FF6A2B,#FFC72C)}
.thr-track.grab .thr-handle{filter:brightness(1.2)}
.cp-mid{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.dial{width:100%;max-width:170px}
.dial .arc{fill:none;stroke:#3A4150;stroke-width:10;stroke-linecap:round}
.dial .ok{fill:none;stroke:#2FBF71;stroke-width:10;stroke-linecap:round}
.dial .ndl{stroke:#FFC72C;stroke-width:4;stroke-linecap:round;transform-origin:60px 60px;transition:transform .08s linear}
.dial text{fill:#E9EDF5;font-size:11px;text-anchor:middle;font-family:var(--f-body)}
.dial .big{font-family:var(--f-display);font-size:20px;fill:#FFC72C}
.cp-row{display:flex;gap:6px;width:100%}
.cp-box{flex:1;background:#0E1015;border-radius:10px;padding:4px 6px;text-align:center;font-size:11px;color:#AEB6C6;line-height:1.1}
.cp-box b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;color:#E9EDF5}
.rot{width:100%;border-radius:12px;padding:6px 4px;text-align:center;font-weight:800;letter-spacing:.08em;background:#20252F;color:#4F5869;border:2px solid #2E3441;font-size:15px;line-height:1.15}
.rot small{display:block;font-size:12px;letter-spacing:0;font-weight:700}
.rot.on{background:#1E8E52;color:#fff;border-color:#62E3A0;box-shadow:0 0 14px #2FBF71;animation:rotblink .5s steps(2) infinite}
.rot.warn{background:#9A5A00;color:#fff;border-color:#FFC72C;box-shadow:0 0 12px #FFC72C}
@keyframes rotblink{50%{filter:brightness(1.35)}}
.stick-track{position:relative;width:96px;height:190px;border-radius:14px;background:#0E1015;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);cursor:grab;touch-action:none;overflow:hidden}
.stick-track .st-t,.stick-track .st-b{position:absolute;left:0;right:0;font-size:10.5px;text-align:center;color:#8D96A8;line-height:1.15;pointer-events:none}
.stick-track .st-t{top:5px}.stick-track .st-b{bottom:5px;color:#9FE3BD}
.stick-shaft{position:absolute;left:50%;top:50%;width:12px;margin-left:-6px;background:linear-gradient(90deg,#222,#555,#222);border-radius:6px;pointer-events:none}
.yoke{position:absolute;left:6px;right:6px;top:50%;height:56px;margin-top:-28px;pointer-events:none}
.yoke svg{width:100%;height:100%;display:block}
.stick-track.grab .yoke{filter:brightness(1.2)}
.cp-hint{grid-column:1/-1;text-align:center;font-size:14px;color:#C9D1E0;min-height:1.3em;margin-top:2px}
.cp-hint b{color:#FFC72C}
/* 조종석: 실제 계기판처럼 (무광 패널·나사·유리 반사) */
.cockpit{background:radial-gradient(circle at 12px 12px,#9AA1AC 0 1.5px,#3A3F48 2.5px 3.5px,transparent 4px),radial-gradient(circle at calc(100% - 12px) 12px,#9AA1AC 0 1.5px,#3A3F48 2.5px 3.5px,transparent 4px),radial-gradient(130% 90% at 50% -10%,#3B414D 0%,#22262E 55%,#15181D 100%);box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.08),inset 0 -6px 14px rgba(0,0,0,.45)}
.cp-box,.rot{box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}
.cp-box{background:linear-gradient(#0B0D11,#151820)}
.dial{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.thr-track,.stick-track{box-shadow:inset 0 3px 10px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.06)}
@media (max-width:370px){.cockpit{grid-template-columns:84px 1fr 92px;gap:6px}.thr-track{width:58px}.stick-track{width:86px}}
.kbdhelp{color:var(--muted);font-size:13px;margin:8px 2px 0}

/* 단계 고르기 */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{border:1px solid var(--hair);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);padding:10px 12px;text-align:left;font:inherit;color:inherit}
.lvl b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px}
.lvl small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.lvl .st{font-size:18px;letter-spacing:2px;margin-top:4px}
.lvl.lock{opacity:.55;filter:grayscale(.6)}
.rankbar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:10px 14px;margin:0 0 14px}
.rankbar .ic{font-size:36px}
.rankbar b{font-family:var(--f-display);font-weight:400;font-size:21px;display:block}
.rankbar small{color:var(--muted);font-size:14px}
.rankbar .meter{height:8px;border-radius:4px;background:var(--hair);margin-top:4px;overflow:hidden}
.rankbar .meter i{display:block;height:100%;background:var(--warm)}
.keys{margin-left:auto;text-align:right;font-size:14px;color:var(--muted)}
.keys b{font-size:20px;color:var(--ink)}

/* 지도 퀴즈 */
.qz{text-align:center}
.qz .qflag{font-size:96px;line-height:1.1}
.qz .qtext{font-size:22px;margin:8px 0 12px;font-family:var(--f-display)}
.qz .opts{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:520px){.qz .opts{grid-template-columns:repeat(3,1fr)}}
.qz .opt{border:2px solid var(--hair);border-radius:16px;background:var(--card);min-height:64px;font-size:20px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-sm)}
.qz .opt.right{background:#DDF5E6;border-color:#2FBF71}.qz .opt.wrong{background:#FCE2D8;border-color:#E0532C}
.qz .fbx{min-height:2.6em;margin:10px 0 0;font-size:17px}
.qprog{display:flex;gap:6px;justify-content:center;margin:2px 0 10px}.qprog i{width:22px;height:8px;border-radius:4px;background:var(--hair)}.qprog i.done{background:var(--warm)}.qprog i.now{background:var(--sign);outline:2px solid var(--plate)}
.qmap{border-radius:var(--r);overflow:hidden;margin:0 0 10px;box-shadow:var(--shadow-sm)}
.qmap svg{display:block;width:100%;height:auto}
.combo{display:inline-block;background:var(--warm);color:#fff;border-radius:999px;padding:0 10px;font-weight:700;margin-left:6px;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* 여행지 잠금 */
.dests button.lock{opacity:.6;filter:grayscale(.7);position:relative}
.dests button .lk{display:block;font-size:13px;color:var(--warm);font-weight:700}
.mute{margin-left:auto}
.gtop .mute{min-width:44px;justify-content:center}
.rankchip{font-size:14px;color:var(--muted)}

/* 도착 엽서·여권 */
.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dests button{border:1px solid var(--hair);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);padding:12px;text-align:left}
.dests button .f{font-size:34px;line-height:1.1}
.dests button b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px}
.dests button span{color:var(--muted);font-size:14px}
.postcard{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.postcard .pics{font-size:44px;letter-spacing:.1em}
.postcard ul{margin:8px 0 0;padding-left:18px}
.postcard li{margin:4px 0}
.stamp{width:120px;height:120px;border-radius:50%;border:4px double var(--pen);color:var(--pen);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font-weight:700;text-align:center;line-height:1.15}
.stamp b{font-family:var(--f-display);font-weight:400;font-size:26px}
.stamp small{font-size:11px}
.passport{display:flex;flex-wrap:wrap;gap:12px}
.passport .stamp{width:96px;height:96px}
.passport .stamp b{font-size:20px}
.passport .stamp:nth-child(2n){transform:rotate(9deg);color:var(--blue);border-color:var(--blue)}
.greet{font-family:var(--f-hand);font-size:26px;margin-left:4px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const PATTERNED=['airport','dots','stars','stripes','sweet'];
(function(k){k=k||'airport';document.documentElement.dataset.skin=k;document.documentElement.classList.toggle('patterned',PATTERNED.includes(k))})(ls.get('hb-skin'));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();const r=new Uint32Array(a.length);crypto.getRandomValues(r);for(let i=a.length-1;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
let voices=[];try{voices=speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices()}catch(e){}
function say(text,lang='ko-KR',rate=.85){if(Sfx.muted)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=voices.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase().slice(0,2)));if(v)u.voice=v;u.rate=rate;speechSynthesis.speak(u)}catch(e){}}

/* ---------- 소리·진동 (Web Audio로 직접 만든 짧은 소리, 파일 없음) ---------- */
const Sfx=(()=>{
  let ctx=null,master=null,eng=null;const S={muted:ls.get('sy-mute')==='1'};
  function ac(){if(S.muted)return null;if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination)}catch(e){return null}}
    if(ctx.state==='suspended')ctx.resume().catch(()=>{});return ctx}
  function tone(f,dur=.12,type='sine',vol=.25,f2=null,delay=0){const c=ac();if(!c)return;const t=c.currentTime+delay,o=c.createOscillator(),gn=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.01);gn.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.02)}
  function noise(dur=.3,vol=.3,freq=800){const c=ac();if(!c)return;const n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const gn=c.createGain();gn.gain.value=vol;n.connect(f).connect(gn).connect(master);n.start()}
  S.unlock=()=>ac();
  S.click=()=>tone(900,.05,'square',.08);
  S.tick=()=>tone(1500,.025,'square',.05);
  S.ding=()=>{tone(1318,.12,'sine',.22);tone(1760,.18,'sine',.18,null,.07)};
  S.combo=n=>{for(let i=0;i<Math.min(n,4);i++)tone(880*Math.pow(1.26,i),.09,'triangle',.16,null,i*.06)};
  S.bad=()=>tone(220,.25,'sawtooth',.12,110);

let QZ=null;
function quizQs(){

  const diffC=pool.filter(c=>{const d=(tzOffsetMin(c.tz)-tzOffsetMin('Asia/Seoul'))/60;return d!==0&&Number.isInteger(d)});
  const countries=[...new Map(CITIES.map(c=>[c.ct,c])).values()];
  const mk={
    night:()=>nightC.length&&dayC.length>=2&&{t:'night',ans:shuffle(nightC)[0],opts:null},
    day:()=>dayC.length&&nightC.length>=2&&{t:'day',ans:shuffle(dayC)[0],opts:null},
    diff:()=>{const c=shuffle(diffC)[0];if(!c)return null;const d=(tzOffsetMin(c.tz)-tzOffsetMin('Asia/Seoul'))/60,a=Math.abs(d);
      const o=new Set([a]);for(const x of shuffle([a+1,a-1,a+2,a-2,a+3]))if(x>0&&o.size<3)o.add(x);return{t:'diff',ans:c,d,a,opts:shuffle([...o])}},
    flag:()=>{const c=shuffle(countries)[0];return{t:'flag',ans:c,opts:shuffle([c,...shuffle(countries.filter(x=>x.ct!==c.ct)).slice(0,2)])}},
  };
  const order=shuffle(['night','day','diff','diff','flag','flag','diff','flag']);const qs=[];const used=new Set();
  for(const t of order){let q=null;for(let k=0;k<6&&(!q||used.has(q.t+q.ans.id));k++)q=mk[t]()||mk.flag();used.add(q.t+q.ans.id);
    if(q.t==='night'||q.t==='day'){const other=(q.t==='night'?dayC:nightC);q.opts=shuffle([q.ans,...shuffle(other).slice(0,2)])}
    qs.push(q)}
  return qs;
}

const ART=(()=>{const names=['sky-day','sky-night','cruise','airport-day','airport-night','grass-day','grass-night','clouds','storm','plane'];
  const A={ready:false,img:{}};let p=null;const cache=new Map();
  A.load=()=>p||=Promise.all(names.map(n=>new Promise(res=>{const i=new Image();i.decoding='async';
    i.onload=()=>{Promise.resolve(i.decode&&i.decode()).catch(()=>{}).then(()=>{A.img[n]=i;res()})};i.onerror=()=>res();i.src='/img/'+n+'.webp'})))
    .then(()=>{A.ready=names.every(n=>A.img[n])});

    const w=Math.round(i.width*h/i.height);
    const mk=flip=>{const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*dpr));cv.height=Math.max(1,Math.round(h*dpr));const x=cv.getContext('2d');
      x.imageSmoothingQuality='high';if(flip){x.translate(cv.width,0);x.scale(-1,1)}x.drawImage(i,0,0,cv.width,cv.height);

      if(n==='airport-day'){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-atop';const hz=x.createLinearGradient(0,0,0,cv.height);hz.addColorStop(0,'rgba(215,232,248,0)');hz.addColorStop(1,'rgba(215,232,248,.22)');x.fillStyle=hz;x.fillRect(0,0,cv.width,cv.height)} // 공기 원근
      return cv};
    c={w,h,n:mk(false)};c.m=n==='plane'||n==='storm'?c.n:mk(true);if(cache.size>40)cache.clear();cache.set(k,c);return c};
  // 거의 움직이지 않는 하늘+지평선 안개는 한 장으로 미리 합쳐 둔다 (매 프레임 한 번만 복사)

  return A})();

        <div class="stick-shaft" id="shaft"></div>
        <div class="yoke" id="yoke"><svg viewBox="0 0 84 56"><path d="M8 14 Q8 6 16 6 L30 6 Q34 6 36 12 L48 12 Q50 6 54 6 L68 6 Q76 6 76 14 L76 38 Q76 50 64 50 L58 50 Q54 50 54 44 L54 30 L30 30 L30 44 Q30 50 26 50 L20 50 Q8 50 8 38Z" fill="#3B4252" stroke="#0B0D12" stroke-width="2.5"/><rect x="34" y="16" width="16" height="10" rx="3" fill="#FFC72C"/><circle cx="18" cy="16" r="3" fill="#E5512D"/><circle cx="66" cy="16" r="3" fill="#2FBF71"/></svg></div></div>

  const cv=$('#cv'),g=cv.getContext('2d'),DPR=Math.min(2,devicePixelRatio||1);

  const hudL=$('#hudL'),hudR=$('#hudR'),msg=$('#msg'),hint=$('#hint'),cock=$('#cockpit');

  /* ----- 조종석 입력: 출력 레버(끌어서 놓으면 그 자리에 머묾)와 조종간(놓으면 가운데로) ----- */
  const thrEl=$('#thr'),stkEl=$('#stk');let lastStep=-1,lastStk=0;
  function setThr(v,user){v=clamp(v,0,1);for(const d of [0,.5,1])if(Math.abs(v-d)<.045)v=d; // 멈춤·반·이륙 자리에서 딸깍

  function drawStk(){const h=stkEl.clientHeight,off=C.stick*(h/2-34);$('#yoke').style.transform=`translateY(${off}px) scale(${1-Math.abs(C.stick)*.06})`;
    const sh=$('#shaft');sh.style.top=(h/2+Math.min(0,off))+'px';sh.style.height=Math.abs(off)+'px';

  const yIn=(el,e)=>{const r=el.getBoundingClientRect();return(e.clientY-r.top)/r.height};

    el.addEventListener('pointerdown',e=>{if(over||paused)return;id=e.pointerId;try{el.setPointerCapture(id)}catch(_){}el.classList.add('grab');fn(yIn(el,e));begin();e.preventDefault()},sig);
    el.addEventListener('pointermove',e=>{if(e.pointerId===id)fn(yIn(el,e))},sig);

  drag(thrEl,f=>setThr(1-(f*thrEl.clientHeight-14)/(thrEl.clientHeight-28),true));

  // 키보드
  const keys={};
  addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();if(e.repeat&&e.code!=='ArrowUp'&&e.code!=='ArrowDown')return;keys[e.code]=true;

  // 여행 중에는 화면을 끌어도 높이가 바뀐다

  // 처음 한 번 보여 주는 짧은 설명

  function step(dt){

        else{const remain=clamp((RW.e-P.liftX)/(RW.e-RW.s),0,1);

    }else if(phase==='landing'){
      if(P.alt<30){rot='warn';rotTxt='FLARE<small>살짝 당기기</small>';hintTxt='땅이 가까워요! <b>조종간을 살짝</b> 당겨요'}
      else{rotTxt='GLIDE<small>불빛 보기</small>';const n=papi();hintTxt=n>2?'하얀 불이 많아요 → 너무 높아요. <b>조종간을 밀거나 출력을 줄여요</b>':n<2?'빨간 불이 많아요 → 너무 낮아요. <b>살짝 당기거나 출력을 올려요</b>':'딱 좋아요! 하얀 불 2개, 빨간 불 2개 👍'}
    }else if(phase==='rollout'){rotTxt='BRAKE<small>출력 멈춤</small>';rot=C.thr<.15?'on':'warn'}
    else if(phase==='cruise'){rotTxt=`⭐ ${stars}<small>${combo>=2?'콤보 ×'+combo:'별 모으기'}</small>`;rot=combo>=3?'on':''}
    const key=[spd,alt,pit,rot,rotTxt,hintTxt,phase].join('|');if(key===lastPanel)return;lastPanel=key;
    $('#ndl').style.transform=`rotate(${-90+clamp(P.v/VMAX,0,1)*180}deg)`;$('#spdT').textContent=spd;$('#altT').textContent=alt;$('#pitT').textContent=pit+'°';
    const r=$('#rot');r.className='rot'+(rot?' '+rot:'');r.innerHTML=rotTxt;if(hint.innerHTML!==hintTxt)hint.innerHTML=hintTxt;
    if(phase==='cruise'||phase==='arrive'){const pr=phase==='arrive'?1:Math.min(1,dist/tripLen);hudL.innerHTML=`ICN ✈ ${dest.code}<div class="prog"><i style="width:${pr*100}%"></i></div>`;hudR.innerHTML=`⭐ <span class="v">${stars}</span>`}
    else if(phase==='landing'||phase==='rollout'){const n=papi();hudL.innerHTML=`착륙 안내등<div style="display:flex;gap:4px;margin-top:4px">${[0,1,2,3].map(i=>`<i style="width:13px;height:13px;border-radius:50%;border:1.5px solid #111;background:${i<n?'#fff':'#E5322D'}"></i>`).join('')}</div>`;hudR.innerHTML=wind?`💨 바람`:night?'🌙 밤':''}
    else{hudL.innerHTML=`${L.n}${wind?' · 💨':''}`;hudR.innerHTML=''}
    Sfx.engineSet(C.thr,P.v);
  }
  // 초록 칸(이륙 속도) 표시
  {const a0=Math.PI,a1=Math.PI*(1-VR/VMAX),x=60+48*Math.cos(a1),y=60-48*Math.sin(a1);$('#okArc').setAttribute('d',`M${x.toFixed(1)} ${(y+4).toFixed(1)} A48 48 0 0 1 108 64`)}
  if(mode==='landing'){$('#rot').innerHTML='GLIDE<small>불빛 보기</small>'}
  setThr(C.thr);setStick(0);
  let last=performance.now(),loop=0;
  const frame=now=>{if(!cv.isConnected)return stop();let dt=Math.min(.1,(now-last)/1000);last=now;
    if(!paused&&(started||phase!=='takeoff')){if(phase==='landing'&&!started){started=true;Sfx.engine(true)}while(dt>0&&!over){const s=Math.min(.02,dt);step(s);dt-=s}}
    if(over){for(const p of parts){p.life+=.016;p.x+=p.vx*.016;p.y+=p.vy*.016}for(const p of pops)p.life+=.016}
    render();loop=requestAnimationFrame(frame)};
  function stop(){cancelAnimationFrame(loop);ac.abort();Sfx.engine(false)}
  flight={stop};
  const tutShown=tutorial(false);
  if(!tutShown&&mode==='landing')paused=false;
  loop=requestAnimationFrame(frame);
}

/* ---------- 도착: 엽서와 여권 도장 ---------- */
function stampHtml(s){return `<div class="stamp"><small>ARRIVED</small><b>${esc(s.code)}</b><small>${esc(s.nm)} ${esc(s.date||'')}</small></div>`}
async function arrival(d,stars,bestCombo){
  const now=new Date(),date=`${now.getMonth()+1}.${now.getDate()}`;
  const before=keysNow();await travelOp('addTrip',{code:d.code,nm:d.nm,date,stars});const after=keysNow();
  const p=partsIn(d.tz),newly=DESTS.filter(x=>x.need>before&&x.need<=after);
  app.innerHTML=`${topbar(d.fl+' '+d.nm+'에 도착!','trip')}
  <div class="card"><h3>그림엽서</h3><div class="postcard"><div>
    <div class="pics">${d.pics}</div>
    <p style="font-size:19px;margin:8px 0 0">${d.ct} <b>${d.nm}</b>에 도착했어요! 모은 별 ⭐ <b>${stars}</b>개${bestCombo>=3?` · 최고 콤보 ×${bestCombo}`:''}</p>
    <ul>${d.facts.map(f=>`<li>${f}</li>`).join('')}</ul></div>${stampHtml({code:d.code,nm:d.nm,date})}</div></div>
  ${newly.length?`<div class="card" style="text-align:center"><h3>🔓 새 여행지가 열렸어요!</h3><p style="font-size:20px">${newly.map(x=>`${x.fl} ${x.nm}`).join(', ')}</p></div>`:''}
  <div class="card"><h3>${josa(d.nm,'은','는')} 지금 몇 시?</h3><div class="city">${anaClock(p)}<div><div class="dg">${hm(p)}</div><div class="diff">${diffText({id:d.id,tz:d.tz})}</div></div></div></div>
  <div class="card"><h3>${d.ct} 말로 인사해요</h3><button class="btn primary" id="hiBtn">🔊 <span class="greet">${d.hi[2]}</span></button></div>
  <div class="row"><button class="btn primary" id="again">다른 나라 가기</button><button class="btn" id="pp">내 여권 보기</button></div>`;
  say(d.nm+'에 도착했어요!');burstConfetti();
  $('#hiBtn').onclick=()=>say(d.hi[0],d.hi[1],.8);$('#again').onclick=()=>go('trip');$('#pp').onclick=()=>go('passport');
}

/* ---------- 화면 ---------- */
let CUR='hub';
function topbar(title,back){return `<div class="gtop">${back?`<button data-back="${back}">← 뒤로</button>`:'<a href="/">← 우리집</a>'}<h1>${title}</h1><button class="mute" id="muteB" aria-label="${Sfx.muted?'소리 켜기':'소리 끄기'}" aria-pressed="${Sfx.muted}">${Sfx.muted?'🔇':'🔊'}</button></div>`}
app.addEventListener('click',e=>{const b=e.target.closest('[data-back]');if(b){Sfx.click();go(b.dataset.back);return}
  const m=e.target.closest('#muteB');if(m){Sfx.setMuted(!Sfx.muted);m.textContent=Sfx.muted?'🔇':'🔊';m.setAttribute('aria-pressed',Sfx.muted);m.setAttribute('aria-label',Sfx.muted?'소리 켜기':'소리 끄기');if(!Sfx.muted){Sfx.unlock();Sfx.ding()}
    if(flight&&!Sfx.muted)Sfx.engine(true)}});
function rankBar(){const r=rankOf(),k=keysNow();
  return `<div class="rankbar"><span class="ic">${r.ic}</span><div style="flex:1;min-width:0"><b>${kidName()} ${r.name}</b>
    <small>${r.nextName?`비행 성공 ${r.next}번 더 하면 ${r.nextName}!`:'최고 계급이에요! 멋져요'}</small><div class="meter"><i style="width:${Math.round(r.pct*100)}%"></i></div></div>
    <div class="keys">🔑 <b>${k}</b><br>열쇠</div></div>`}
function renderHub(){
  app.innerHTML=`${topbar('놀이터')}${rankBar()}
  <div class="hub">
    <button class="gcard" data-go="runway"><span class="art" style="background:url(/img/airport-day.webp) center bottom/100% auto no-repeat,url(/img/sky-day.webp) center/cover">🛫</span><b>활주로 이착륙</b><span>조종석에 앉아 출력 레버를 밀고, 조종간을 당겨 이륙해요.</span></button>
    <button class="gcard" data-go="trip"><span class="art" style="background:url(/img/plane.webp) center 48%/62% auto no-repeat,url(/img/cruise.webp) center/cover"></span><b>${kidName()}항공 여행</b><span>인천에서 이륙해 세계 ${DESTS.length}개 도시로! 열쇠를 모으면 새 나라가 열려요.</span></button>
    <a class="gcard" href="/race.html" style="text-decoration:none;color:inherit"><span class="art" style="background:#C4553F url(/img/stadium.webp) center 35%/cover">🏃</span><b>가족 달리기</b><span>버튼을 타다닥! 엄마·아빠 폰과 같이, 또는 거북·토끼·치타와 시합해요.</span></a>
    <button class="gcard" data-go="map"><span class="art" style="background:url(/img/clouds.webp) center bottom/100% auto no-repeat,url(/img/sky-night.webp) center/cover">🌍</span><b>세계 시계 지도</b><span>미국은 지금 몇 시? 낮인 나라, 밤인 나라를 찾아봐요.</span></button>
    <button class="gcard" data-go="quiz"><span class="art" style="background:url(/img/clouds.webp) center bottom/100% auto no-repeat,url(/img/sky-day.webp) center 30%/cover">❓</span><b>지도 퀴즈</b><span>밤인 도시 찾기, 시차 맞히기, 국기 맞히기!${T.travel.best.quiz?` 최고 ${T.travel.best.quiz}점`:''}</span></button>
    <button class="gcard" data-go="passport"><span class="art" style="background:url(/img/airport-night.webp) center bottom/100% auto no-repeat,url(/img/sky-night.webp) center 70%/cover">🛂</span><b>내 여권</b><span>${T.travel.stamps.length?`도장 ${T.travel.stamps.length}개 · 여행 별 ⭐ ${T.travel.stars}`:'여행을 다녀오면 도장이 찍혀요.'}</span></button>
  </div>
  <p class="helptxt">🔑 열쇠: 공부방 포도알 1알 = 열쇠 1개, 놀이에서 모은 여행 별 30개 = 열쇠 1개. ${T.online?'기록은 가족 모두의 기기에 같이 저장돼요.':'가족 코드가 없어서 이 기기에만 저장돼요.'}</p>`;
  $$('[data-go]').forEach(b=>b.onclick=()=>{Sfx.click();go(b.dataset.go)});
}
function renderRunway(){
  const lv=(m)=>LEVELS[m].map((L,i)=>{const k=lvlKey(m,i),b=T.travel.best[k]||0,open=unlockedLv(m,i),st=starsOf(b);
    return `<button class="lvl${open?'':' lock'}" data-m="${m}" data-l="${i}" ${open?'':'aria-disabled="true"'}><b>${open?'':'🔒 '}${i+1}. ${L.n}</b><small>${open?L.d:'앞 단계를 성공하면 열려요'}</small>
      <div class="st">${[0,1,2].map(j=>j<st?'⭐':'☆').join('')}${b?` <small style="display:inline">${b}점</small>`:''}</div></button>`}).join('');
  app.innerHTML=`${topbar('활주로 이착륙','hub')}${rankBar()}
  <div class="card"><h3>🛫 이륙하기</h3><div class="levels">${lv('takeoff')}</div></div>
  <div class="card"><h3>🛬 착륙하기</h3><div class="levels">${lv('landing')}</div></div>
  <p class="helptxt">처음 해 보는 단계는 짧은 설명이 먼저 나와요. 비행 중 ❓를 누르면 다시 볼 수 있어요.</p>`;
  $$('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m,i=+b.dataset.l;if(!unlockedLv(m,i)){toastG('앞 단계를 먼저 성공해 봐요!');Sfx.bad();return}Sfx.click();startFlight(m,{level:i})});
}
function renderTrip(){
  const k=keysNow();
  app.innerHTML=`${topbar(kidName()+'항공 여행','hub')}${rankBar()}
  <div class="card"><h3>어디로 갈까요?</h3><div class="dests">${DESTS.map(d=>{const open=k>=d.need;
    return `<button data-d="${d.id}" class="${open?'':'lock'}"><span class="f">${open?d.fl:'🔒'}</span><b>${d.nm}</b><span>${d.ct} · ${d.code}</span>${open?'':`<span class="lk">🔑 ${d.need}개 필요 (지금 ${k}개)</span>`}</button>`}).join('')}</div>
  <p class="helptxt">인천공항(ICN)에서 직접 이륙해서 출발해요. 공부방에서 포도알을 받으면 열쇠가 생겨 새 나라가 열려요.</p></div>`;
  $$('[data-d]').forEach(b=>b.onclick=()=>{const d=DESTS.find(x=>x.id===b.dataset.d);if(keysNow()<d.need){Sfx.bad();toastG(`열쇠가 ${d.need-keysNow()}개 더 필요해요. 공부방에서 포도알을 모아 봐요!`);return}Sfx.click();startFlight('trip',{dest:d})});
}
function renderPassport(){
  const pp=T.travel.stamps,seen=new Set(pp.map(s=>s.code));
  app.innerHTML=`${topbar('내 여권','hub')}${rankBar()}
  <div class="card"><h3>모은 나라 ${DESTS.filter(d=>seen.has(d.code)).length} / ${DESTS.length}</h3><div class="dests">${DESTS.map(d=>`<div style="text-align:center;padding:6px;border-radius:12px;${seen.has(d.code)?'':'opacity:.35;filter:grayscale(1)'}"><span style="font-size:30px">${d.fl}</span><br>${d.nm}</div>`).join('')}</div></div>
  <div class="card"><h3>찍힌 도장 ${pp.length}개 · 여행 별 ⭐ ${T.travel.stars||0}</h3>${pp.length?`<div class="passport">${pp.map(stampHtml).join('')}</div>`:'<p class="empty">아직 도장이 없어요.</p>'}</div>`;
}
function go(v){endFlight();clearInterval(mapTimer);try{speechSynthesis.cancel()}catch(e){}CUR=v;
  ({hub:renderHub,map:renderMap,quiz:renderQuiz,runway:renderRunway,trip:renderTrip,passport:renderPassport})[v]();window.scrollTo(0,0)}
addEventListener('pointerdown',()=>Sfx.unlock(),{once:true});
(async()=>{const h=location.hash.slice(1),v=['map','quiz','runway','trip','passport'].includes(h)?h:'hub';
  app.innerHTML='<p class="loading">✈️ 놀이터를 여는 중…</p>';await loadTravel();go(v)})();
try{localStorage.setItem('hb-tab','play')}catch(e){} // 우리집으로 돌아가면 놀이 탭이 열린다
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
