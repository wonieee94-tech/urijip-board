<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세윤이 공부방</title>
<meta name="theme-color" content="#F7F5EE">
<meta name="apple-mobile-web-app-title" content="공부방">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/skins.css">
<style>
/* 레이아웃: 한 줄 기둥(최대 760px), 큰 카드와 큰 버튼. 과목마다 고유색, 원고지 칸·텐프레임·묶음 점이 각 과목의 도구 */
:root{
  --bg:#EDF3F7; --surface:#FFFFFF; --ink:#1D2B45; --muted:#5B6983; --line:#CCD8E4;
  --accent:#1E8558; --accent-soft:#DCF0E5; --move:#E0532C; --move-soft:#FCE2D8;
  --star:#E9A821; --grid:#E3AFAF; --trace:rgba(29,43,69,.16);
  --c-han:#1E8558; --c-han-s:#DCF0E5; --c-math:#2F6FD6; --c-math-s:#DDE8FB;
  --c-times:#8A4FD0; --c-times-s:#ECE1FA; --c-abc:#D2692A; --c-abc-s:#FBE6D6;
  --dot1:#2F6FD6; --dot2:#E9A821;
  --pen:#E5322D;
  --f-en:"Andika","Comic Sans MS","Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111824; --surface:#1A2335; --ink:#E7EDF6; --muted:#9BA9C1; --line:#2D3A52;
  --accent:#4FC48D; --accent-soft:#183528; --move:#FF7D55; --move-soft:#3B2219;
  --star:#F4C451; --grid:#7A4646; --trace:rgba(231,237,246,.18);
  --c-han:#4FC48D; --c-han-s:#183528; --c-math:#6FA2F5; --c-math-s:#1A2A47;
  --c-times:#B48AF0; --c-times-s:#2B2142; --c-abc:#F39A5E; --c-abc-s:#3A2617;
  --dot1:#6FA2F5; --dot2:#F4C451; --pen:#FF5A4E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111824; --surface:#1A2335; --ink:#E7EDF6; --muted:#9BA9C1; --line:#2D3A52;
  --accent:#4FC48D; --accent-soft:#183528; --move:#FF7D55; --move-soft:#3B2219;
  --star:#F4C451; --grid:#7A4646; --trace:rgba(231,237,246,.18);
  --c-han:#4FC48D; --c-han-s:#183528; --c-math:#6FA2F5; --c-math-s:#1A2A47;
  --c-times:#B48AF0; --c-times-s:#2B2142; --c-abc:#F39A5E; --c-abc-s:#3A2617;
  --dot1:#6FA2F5; --dot2:#F4C451; --pen:#FF5A4E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;padding-top:env(safe-area-inset-top,0px);margin:0}
.wrap{max-width:760px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,.brand{font-family:var(--f-letter);font-weight:400;text-wrap:balance;line-height:1.25;margin:0}
.en{font-family:var(--f-en)}
.top{display:flex;align-items:center;gap:12px;padding-block:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{font-size:22px;flex:1;min-width:0}
.back{border:0;background:var(--surface);border-radius:999px;padding:8px 16px;font-size:16px;box-shadow:0 1px 0 var(--line)}
.stars{font-family:var(--f-letter);font-size:22px;color:var(--star);background:var(--surface);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.stars.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}}

.hello{padding-block:18px 8px}
.eyebrow{margin:0;color:var(--muted);font-size:15px;letter-spacing:.06em}
.hello h1{font-size:clamp(30px,7vw,42px)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:520px){.menu{grid-template-columns:1fr}}
.mcard{--c:var(--c-han);--cs:var(--c-han-s);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:16px;align-items:center;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;min-height:120px}
.mcard:active{transform:scale(.98)}
.mcard.math{--c:var(--c-math);--cs:var(--c-math-s)}.mcard.times{--c:var(--c-times);--cs:var(--c-times-s)}.mcard.abc{--c:var(--c-abc);--cs:var(--c-abc-s)}
.mglyph{grid-row:span 2;width:78px;height:78px;display:grid;place-items:center;font-family:var(--f-letter);font-size:38px;line-height:1;
  border-radius:14px;background:var(--cs);color:var(--c);position:relative;white-space:nowrap}
.mglyph.sm{font-size:27px}
.mglyph i{position:absolute;right:6px;bottom:2px;font-style:normal;font-size:22px;color:var(--move)}
.mcard b{font-family:var(--f-letter);font-weight:400;font-size:23px}
.mcard small{color:var(--muted);font-size:15px;line-height:1.4}
.parent{margin-top:22px;background:var(--surface);border-radius:var(--r);padding:14px 18px;color:var(--muted);font-size:16px}
.parent summary{cursor:pointer;color:var(--ink)}
.parent p{margin:.6em 0 0}

.title{font-size:clamp(28px,6vw,36px);margin:8px 0 14px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;margin-bottom:14px}
.card h3{font-size:23px;margin-bottom:8px}
.card p{margin:.4em 0}
.ask{background:var(--move-soft);border-radius:var(--r);padding:14px 18px;margin-bottom:14px}
.ask .who{font-size:14px;color:var(--move);letter-spacing:.05em}
.ask p{margin:2px 0 0;font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:17px;white-space:nowrap;min-height:44px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ctx{color:var(--muted);font-size:19px;text-align:center}
.ctx b{color:var(--ink)}
.stage{position:relative;display:flex;justify-content:center;gap:clamp(6px,2vw,14px);padding-block:18px 10px;min-height:150px;align-items:center}
.tile{font-family:var(--f-letter);font-size:clamp(58px,17vw,108px);line-height:1;width:1.25em;height:1.25em;display:grid;place-items:center;
  border:2px dashed var(--grid);border-radius:10px;background:var(--surface);transition:background .3s,color .3s}
.tile.dest.lit{background:var(--move-soft);color:var(--move)}
.mchip{position:absolute;font-family:var(--f-letter);color:var(--move);pointer-events:none;line-height:1;z-index:2}
.modes{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.mode{font-size:15px;padding:3px 12px;border-radius:999px;color:var(--muted);border:1.5px solid var(--line)}
.mode.on{color:var(--surface);background:var(--ink);border-color:var(--ink)}
.parts{text-align:center;color:var(--muted);margin-top:12px!important}
.parts b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 20px;font-size:18px;min-height:56px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{font-size:21px;padding:14px 28px}
.btn.ghost{border-color:transparent;background:var(--accent-soft);color:var(--accent);min-height:44px;padding:6px 16px}
.cta{margin-top:6px}
.family{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:12px 0}
.fam{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:var(--surface)}
.fam .fw{display:block;font-family:var(--f-letter);font-size:26px}
.fam .fw em{font-style:normal;color:var(--accent)}
.fam .fs{color:var(--move);font-size:17px}
.note{color:var(--muted)}
.tip{border:2px solid var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pair button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-size:17px;line-height:1.4}
.pair button b{font-family:var(--f-letter);font-weight:400;font-size:28px;display:block}
.pair .s{color:var(--move)}

.progress{display:flex;gap:6px;margin-bottom:14px}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.now{background:var(--star)}
.qcard{text-align:center}
.qemoji{font-size:64px;line-height:1.1}
.qtext{font-size:22px}
.qtext .sound{color:var(--move);font-family:var(--f-letter);font-weight:400;font-size:34px}
.faint{color:var(--muted)}
.qask{font-family:var(--f-letter);font-size:24px;margin-top:10px!important}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{font-family:var(--f-letter);font-size:34px;border:3px solid var(--line);background:var(--surface);border-radius:16px;min-height:84px;font-variant-numeric:tabular-nums}
.opt.en{font-family:var(--f-en);font-weight:700}
.opt small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt.wrong{border-color:var(--move);background:var(--move-soft);color:var(--move)}
.opts.jamo{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))}
.word{font-family:var(--f-letter);font-size:clamp(48px,13vw,76px);line-height:1.1;display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:10px 0;flex-wrap:wrap}
.word.en{font-family:var(--f-en);font-weight:700}
.word .q{color:var(--move);border:3px dashed var(--move);border-radius:12px;width:1.1em;display:inline-grid;place-items:center}
.word .faint{font-size:.55em;align-self:center}
.slotwrap{display:inline-flex;flex-direction:column;align-items:center;line-height:.95}
.slot{font-size:.5em;width:1.3em;height:1.1em;border:3px dashed var(--move);border-radius:8px;display:grid;place-items:center;color:var(--move)}
.slot.filled{border-style:solid;background:var(--move-soft)}
.fb{min-height:20px}
.fbbox{border-radius:var(--r);padding:16px 20px;margin-bottom:14px;font-size:19px}
.fbbox.ok{background:var(--accent-soft)}
.fbbox.no{background:var(--move-soft)}
.fbbox b{font-family:var(--f-letter);font-weight:400;font-size:1.15em}
.fbbox .row{justify-content:flex-end;margin-top:10px}
.hint{color:var(--move);font-size:19px}
.end{text-align:center;padding-block:30px}
.end .big{font-family:var(--f-letter);font-size:64px;color:var(--star)}

.vrow{display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--f-letter);font-size:clamp(36px,10vw,54px);flex-wrap:wrap}
.vrow button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:14px;min-width:1.5em;padding:0 .2em;font-size:inherit;font-family:inherit}
.vrow .res{background:var(--move-soft);color:var(--move)}
.vrow small{font-family:var(--f-body);font-size:16px;color:var(--muted);width:100%;text-align:center}

.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;font-size:17px}
.seg button.on{background:var(--ink);color:var(--surface)}
.wtop{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.wtop .qemoji{font-size:52px}
.boxes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0 16px;--bx:100px}
.gap{width:18px}
.box{position:relative;width:var(--bx);height:var(--bx);border:2px solid var(--grid);background:var(--surface);
  background-image:linear-gradient(var(--grid),var(--grid)),linear-gradient(var(--grid),var(--grid));
  background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat}
.box .g{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-body);font-size:calc(var(--bx)*.78);line-height:1;pointer-events:none}
.box .trace{color:var(--trace);visibility:hidden}
.box .ans{color:var(--move);opacity:.5;visibility:hidden;z-index:2}
.boxes.tracing .trace,.boxes.checked .ans{visibility:visible}
.box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
.wfb{text-align:center}
.wfb .line{font-size:20px;margin:4px 0}
.wfb .line b{font-family:var(--f-letter);font-weight:400;font-size:28px}
.wfb .s{color:var(--move)}
.notts{font-size:14px;color:var(--muted);text-align:center}

/* 셈하기: 텐프레임 */
.eq{font-family:var(--f-letter);font-size:clamp(46px,12vw,68px);line-height:1.1;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.eq .q{color:var(--move)}
.frames{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:12px 0}
.tf{display:grid;grid-template-columns:repeat(5,clamp(30px,8vw,44px));grid-auto-rows:clamp(30px,8vw,44px);border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface)}
.tf span{border:1px solid var(--line);display:grid;place-items:center}
.tf span::after{content:"";width:72%;height:72%;border-radius:50%}
.tf .p1::after{background:var(--dot1)}
.tf .p2::after{background:var(--dot2)}
.tf .gone::after{background:transparent;border:3px dashed var(--move)}
.tf .gone{background:linear-gradient(45deg,transparent 46%,var(--move) 46% 54%,transparent 54%)}
.legend{font-size:16px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin:0 4px}

/* 구구단: 묶음 */
.groups{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
.grp{display:flex;flex-wrap:wrap;gap:3px;padding:6px;border:2px solid var(--c-times);border-radius:12px;background:var(--c-times-s);max-width:calc(5*13px + 4*3px + 16px)}
.grp i{width:13px;height:13px;border-radius:50%;background:var(--c-times)}
.ttable{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 14px;text-align:left;min-height:56px}
.trow b{font-family:var(--f-letter);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.trow b em{font-style:normal;color:var(--c-times)}
.trow small{color:var(--muted);font-size:14px}

/* 파닉스 */
.abcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.abcgrid button{border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:70px;font-family:var(--f-en);font-weight:700;font-size:30px}
.abcgrid button.on{border-color:var(--c-abc);background:var(--c-abc-s);color:var(--c-abc)}
.abcshow{text-align:center}
.abcshow .L{font-family:var(--f-en);font-weight:700;font-size:clamp(72px,20vw,110px);line-height:1;color:var(--c-abc)}
.abcshow .ph{font-family:var(--f-en);font-size:28px;color:var(--muted)}
.abcshow .ex{font-family:var(--f-en);font-weight:700;font-size:38px}
.abcshow .ex em{font-style:normal;color:var(--c-abc)}
.slots{display:flex;justify-content:center;gap:10px;margin:14px 0}
.sl{width:clamp(58px,16vw,78px);height:clamp(58px,16vw,78px);border:3px dashed var(--c-abc);border-radius:14px;display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:clamp(36px,10vw,50px);background:var(--surface)}
.sl.f{border-style:solid;background:var(--c-abc-s);color:var(--c-abc)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tl{width:clamp(58px,16vw,74px);height:clamp(58px,16vw,74px);border:3px solid var(--line);border-radius:14px;background:var(--surface);font-family:var(--f-en);font-weight:700;font-size:clamp(32px,9vw,44px)}
.tl:disabled{opacity:.25}
h1,h2,h3,.brand{font-family:var(--f-head)}
.tile,.word,.opt,.fam .fw,.pair button b,.vrow,.mchip,.qtext .sound,.fbbox b,.wfb .line b,.mcard b,.qask,.slotwrap{font-weight:700}
.stars,.mglyph,.end .big,.eq,.trow b,.today4 b{font-family:var(--f-display);font-weight:400}
a.back{text-decoration:none;color:inherit}
/* 채점 표시 */
.qcard,.boxwrap{position:relative}
.mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4}
.mark svg{width:min(78%,340px);height:auto;overflow:visible}
.mark path{fill:none;stroke:var(--pen);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;opacity:.88;stroke-dasharray:1000;stroke-dashoffset:1000;animation:pen .55s ease-out forwards}
@keyframes pen{to{stroke-dashoffset:0}}
.score{position:relative;display:inline-block;padding:18px 34px;font-family:var(--f-display);font-size:58px;line-height:1}
.score .mark svg{width:150%}
.prize{margin-top:14px}

/* ===== 우리집 보드와 같은 문구 테마 ===== */
:root{--bg:#F7F5EE;--surface:#FFFFFF;--ink:#1F2433;--muted:#646B7E;--line:#1F2433;--rule:#DCE6F0;--tape1:#FFD34E;--tape2:#9BE3C3;--tape3:#FFB3C7;--tape4:#A9CCFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161B26;--surface:#202839;--ink:#EEF1F7;--muted:#A3ACBF;--line:#05070C;--rule:#232B3B;--tape1:#C9A42E;--tape2:#3E8F6E;--tape3:#B85E7A;--tape4:#4A6FA8}}
:root[data-theme="dark"]{--bg:#161B26;--surface:#202839;--ink:#EEF1F7;--muted:#A3ACBF;--line:#05070C;--rule:#232B3B;--tape1:#C9A42E;--tape2:#3E8F6E;--tape3:#B85E7A;--tape4:#4A6FA8}
body{background:var(--skin-bg)}
:root{--paper:var(--bg);--card:var(--surface)}
.top{background:var(--bg)}
body::before{background:var(--bg)}
.card,.mcard{border:2.5px solid var(--line);box-shadow:4px 4px 0 var(--line)}
.mcard:active,.btn:active,.opt:active{transform:translate(2px,2px);box-shadow:none}
.title{display:inline-block;padding:6px 20px 4px;background:var(--tape1);color:#1F2433;transform:rotate(-1.5deg);
  clip-path:polygon(0 8%,3% 0,7% 9%,11% 0,100% 0,97% 12%,100% 25%,97% 40%,100% 55%,97% 70%,100% 85%,97% 100%,0 100%,3% 88%,0 74%,3% 60%,0 46%,3% 32%,0 18%)}
.end .title{background:transparent;transform:none;clip-path:none;padding:0}
.hello h1{font-size:clamp(34px,8vw,46px)}
.eyebrow{font-family:var(--f-hand);font-size:19px;letter-spacing:0}
.btn{border-width:2.5px;box-shadow:2px 2px 0 var(--line);font-weight:700}
.btn.ghost{border-color:var(--line)}
.opt{border:2.5px solid var(--line);box-shadow:2px 2px 0 var(--line)}
.back{border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);font-weight:700}
.stars{background:var(--tape1);color:#1F2433;border:2px solid var(--line)}
.chip{border-color:var(--line)}
.chip.on{background:var(--tape1);color:#1F2433;border-color:var(--line)}
.ask{border:2.5px solid var(--line);transform:rotate(-.6deg);box-shadow:3px 4px 0 rgba(20,25,40,.18)}

function chipPoint(tile,where,jung){

  if(where==='bottom')return{x:x0+r.width*.5,y:y0+r.height*.78};

async function flyChip(ch,from,to,size){
  const c=document.createElement('span');c.className='mchip';c.textContent=ch;c.style.fontSize=size+'px';
  $('#stage').appendChild(c);
  const w=c.offsetWidth,h=c.offsetHeight;c.style.left=(from.x-w/2)+'px';c.style.top=(from.y-h/2)+'px';
  const dx=to.x-from.x,dy=to.y-from.y;
  if(!reduce&&c.animate){try{await c.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx/2}px,${dy/2-size*.9}px) scale(1.25)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(1)`}],{duration:950,easing:'ease-in-out',fill:'forwards'}).finished}catch(e){}}
  c.remove();
}

function tenFrames(a,b,op){
  const total=op==='+'?a+b:a,n=Math.max(1,Math.ceil(total/10));let html='';
  for(let f=0;f<n;f++){html+='<div class="tf">';for(let k=0;k<10;k++){const i=f*10+k;let c='';
    if(i<total)c=op==='+'?(i<a?'p1':'p2'):(i<a-b?'p1':'p1 gone');html+=`<span class="${c}"></span>`}html+='</div>'}
  return html;
}
function numOpts(ans,max){const s=new Set([ans]);const d=shuffle([-2,-1,1,2,3,-3,10,-10]);for(const x of d){if(s.size>=4)break;const v=ans+x;if(v>=0&&v<=max)s.add(v)}return shuffle([...s])}
function mathGame(title,gen,max){return{title,pool:()=>Array.from({length:8},gen),

    ${p.hint?'<p><button class="btn ghost" id="hint">💡 10 만들기 힌트</button></p><p class="hint" id="hintText"></p>':''}
    <div class="opts">${numOpts(p.ans,max).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`,
  bind:p=>{if(p.hint)$('#hint').onclick=()=>{$('#hintText').innerHTML=p.hint};
    $$('.opt').forEach(b=>b.onclick=()=>{if(G.answered)return;const ok=+b.dataset.v===p.ans;
      b.classList.add(ok?'right':'wrong');$$('.opt').find(x=>+x.dataset.v===p.ans).classList.add('right');$('#qa').textContent=p.ans;
      speak(`${p.a} ${p.op==='+'?'더하기':'빼기'} ${p.b}는 ${p.ans}`);
      const why=p.op==='+'?`${p.a}개와 ${p.b}개를 합치면 ${p.ans}개`:`${p.a}개에서 ${p.b}개를 빼면 ${p.ans}개`;
      answer(ok,(ok?'딩동댕! ':`정답은 <b>${p.ans}</b>! `)+why+(p.hint&&!ok?`<br>${p.hint}`:''))})}}}
const genAdd10=()=>{const a=rnd(1,9),b=rnd(1,10-a);return{a,b,op:'+',ans:a+b}};

      <p class="qask">소리는 이렇게 나요. 글자로는 어떻게 쓸까?</p>
      <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`,
    bind:({it})=>{const full=it.w+it.j,snd=soundOf(full),{chip}=movedOf(it.w);
      const s=()=>speak(it.pre+full+it.post);s();$('#say').onclick=s;
      $$('.opt').forEach(b=>b.onclick=()=>{if(G.answered)return;const ok=b.dataset.v===full;
        b.classList.add(ok?'right':'wrong');$$('.opt').find(x=>x.dataset.v===full).classList.add('right');
        answer(ok,ok?`딩동댕! <b>${it.w}</b>의 받침 <b>${chip}</b>이 이사 가서 [${snd}]로 들려요.`
          :`정답은 <b>${full}</b>! [${snd}]에서 들리는 <b>${chip}</b> 소리는 원래 <b>${it.w}</b>의 받침이에요.`)})}},
  detective:{title:'받침 탐정',pool:()=>LINK.filter(it=>{const m=MOVE[dec(it.w[it.w.length-1]).jong];return m&&m[0]===0&&m[1]>=0}).map(it=>{
      const real=JONG[dec(it.w[it.w.length-1]).jong];const grp=GROUPS.find(g=>g.includes(real))||[real];
      return{it,real,opts:shuffle([real,...shuffle(grp.filter(x=>x!==real)).slice(0,3)])}}),
    q:({it,opts})=>{const {base}=movedOf(it.w);return`<div class="qemoji">${it.e}</div>
      <div class="word"><span class="faint">${it.pre}</span>${it.w.slice(0,-1)}<span class="slotwrap"><span>${base}</span><span class="slot" id="slot">?</span></span>${it.j}<span class="faint">${it.post}</span></div>
      <p class="qask">빈칸에 들어갈 받침은?</p>
      <div class="opts jamo">${opts.map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>
      <p style="margin-top:14px"><button class="btn ghost" id="hint">💡 비법 쓰기</button></p><p class="hint" id="hintText"></p>`},
    bind:({it,real})=>{const full=it.w+it.j,snd=soundOf(full),b=it.w.length-1;
      $('#hint').onclick=()=>{speak(full);$('#hintText').innerHTML=`소리 내 보면 [${snd}]! ‘${snd[b+1]}’의 첫소리가 이사 간 받침이에요.`};
      $$('.opt').forEach(btn=>btn.onclick=()=>{if(G.answered)return;const ok=btn.dataset.v===real;
        btn.classList.add(ok?'right':'wrong');$$('.opt').find(x=>x.dataset.v===real).classList.add('right');
        const s=$('#slot');s.textContent=real;s.classList.add('filled');speak(it.pre+full+it.post);
        answer(ok,ok?`맞아요! <b>${full}</b>는 [${snd}]로 소리 나요.`:`정답은 <b>${real}</b>, <b>${it.w}</b>예요. ${full} → [${snd}], 이사 간 ${real} 소리가 원래 받침이에요.`)})}},
  vgame:{title:'ㅔ일까 ㅐ일까',pool:()=>VOWEL.map(v=>{const k=[...v.w].findIndex(c=>{const d=dec(c);return d&&(d.jung===1||d.jung===5)});const d=dec(v.w[k]);
      return{v,k,ans:v.w[k],e5:comp(d.cho,5,d.jong),a1:comp(d.cho,1,d.jong)}}),
    q:({v,k,e5,a1})=>`<div class="qemoji">${v.e}</div>
      <div class="word">${[...v.w].map((c,i)=>i===k?'<span class="q">?</span>':c).join('')}</div>
      <button class="btn ghost" id="say">🔊 다시 듣기</button>
      <div class="opts"><button class="opt" data-v="${e5}">${e5}<small>ㅔ (어+이)</small></button><button class="opt" data-v="${a1}">${a1}<small>ㅐ (아+이)</small></button></div>`,
    bind:({v,ans})=>{const s=()=>speak(v.w);s();$('#say').onclick=s;
      $$('.opt').forEach(b=>b.onclick=()=>{if(G.answered)return;const ok=b.dataset.v===ans;
        b.classList.add(ok?'right':'wrong');$$('.opt').find(x=>x.dataset.v===ans).classList.add('right');
        $('.word .q').outerHTML=`<span style="color:var(--accent)">${ans}</span>`;
        const vw=dec(ans).jung===5?'ㅔ':'ㅐ';
        answer(ok,(ok?`딩동댕! <b>${v.w}</b>`:`<b>${v.w}</b>는 <b>${vw}</b>를 써요. 눈으로 기억해 두자!`)+(v.tip?`<br>${v.tip}`:''))})}},
  add10:mathGame('10까지 덧셈',genAdd10,10),
  sub10:mathGame('10까지 뺄셈',genSub10,10),
  add20:mathGame('10 만들기 덧셈',genAdd20,20),
  sub20:mathGame('10 넘는 뺄셈',genSub20,20),
  tquiz:{title:'구구단 퀴즈',pool:()=>DAN?shuffle([1,2,3,4,5,6,7,8,9]).map(n=>({d:DAN,n})):Array.from({length:8},()=>({d:rnd(2,9),n:rnd(1,9)})),
    q:({d,n})=>`<div class="eq">${d} × ${n} = <span class="q" id="qa">?</span></div>
      <div class="groups">${groupsHtml(d,n)}</div><p class="legend">${d}개씩 ${n}묶음</p>
      <div class="opts">${[...new Set([d*n,d*n+d,Math.max(0,d*n-d),d*n+1,d*n-1])].slice(0,4).sort(()=>Math.random()-.5).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`,
    bind:({d,n})=>{const ans=d*n;
      $$('.opt').forEach(b=>b.onclick=()=>{if(G.answered)return;const ok=+b.dataset.v===ans;
        b.classList.add(ok?'right':'wrong');$$('.opt').find(x=>+x.dataset.v===ans).classList.add('right');$('#qa').textContent=ans;
        speak(`${d} 곱하기 ${n}${eun(n)} ${ans}`);
        answer(ok,`${ok?'딩동댕! ':''}<b>${d} × ${n} = ${ans}</b><br>${d}개씩 ${n}묶음이면 ${ans}개예요.`)})}},
  first:{title:'첫소리 찾기',pool:()=>ALPHA.filter(a=>a[2][0]===a[0]).map(a=>({a,opts:shuffle([a[0],...shuffle(ALPHA.map(x=>x[0]).filter(x=>x!==a[0])).slice(0,2)])})),
    q:({a,opts})=>`<div class="qemoji">${a[3]}</div>
      <div class="word en"><span class="q">?</span>${a[2].slice(1)}</div>
      <button class="btn ghost" id="say">🔊 다시 듣기</button>
      <p class="qask">어떤 글자로 시작할까?</p>
      <div class="opts" style="grid-template-columns:repeat(3,1fr)">${opts.map(o=>`<button class="opt en" data-v="${o}">${o}</button>`).join('')}</div>`,
    bind:({a})=>{const s=()=>speakEn(a[2]);s();$('#say').onclick=s;
      $$('.opt').forEach(b=>b.onclick=()=>{if(G.answered)return;const ok=b.dataset.v===a[0];
        b.classList.add(ok?'right':'wrong');$$('.opt').find(x=>x.dataset.v===a[0]).classList.add('right');
        $('.word .q').outerHTML=`<span style="color:var(--c-abc)">${a[0]}</span>`;speakEn(`${a[0]}. ${a[2]}`);
        answer(ok,`${ok?'Great! ':''}<b class="en">${a[2]}</b>은 <b class="en">${a[0]}</b> ${a[1]} 소리로 시작해요.`)})}},
  build:{title:'낱말 만들기',pool:()=>CVC.map(([w,e])=>({w,e,tiles:shuffle([...w,...shuffle('abcdefghijklmnoprstuvw'.split('').filter(x=>!w.includes(x))).slice(0,2)])})),
    q:({w,e,tiles})=>`<div class="qemoji">${e}</div>
      <button class="btn ghost" id="say">🔊 다시 듣기</button>
      <div class="slots" id="slots">${[...w].map((_,i)=>`<button class="sl" data-s="${i}"></button>`).join('')}</div>
      <p class="qask">들리는 소리대로 글자를 놓아 봐!</p>
      <div class="tiles">${tiles.map((t,i)=>`<button class="tl" data-i="${i}">${t}</button>`).join('')}</div>`,
    bind:({w,tiles})=>{const s=()=>speakEn(w);s();$('#say').onclick=s;const filled=[];
      const draw=()=>{$$('.sl').forEach((sl,i)=>{const t=filled[i];sl.textContent=t!=null?tiles[t]:'';sl.classList.toggle('f',t!=null)});
        $$('.tl').forEach((b,i)=>b.disabled=filled.includes(i))};
      $$('.tl').forEach(b=>b.onclick=()=>{if(G.answered||filled.length>=w.length)return;const i=+b.dataset.i;speakEn(tiles[i],.6);filled.push(i);draw();
        if(filled.length===w.length){const built=filled.map(i=>tiles[i]).join('');const ok=built===w;
          if(!ok){$$('.sl').forEach((sl,i)=>sl.textContent=w[i])}speakEn(w);
          answer(ok,ok?`Great! <b class="en">${w}</b> — ${[...w].join(' · ')}`:`정답은 <b class="en">${w}</b>예요. 소리를 하나씩: ${[...w].join(' · ')}`)}});
      $$('.sl').forEach(sl=>sl.onclick=()=>{if(G.answered)return;const i=+sl.dataset.s;if(i<filled.length){filled.splice(i,1);draw()}})}},
};
function startGame(kind){G={kind,qs:shuffle(GAMES[kind].pool()).slice(0,8),i:0,right:0,answered:false};renderGame()}
function renderGame(){
  const def=GAMES[G.kind];if(G.i>=G.qs.length)return renderEnd();
  const q=G.qs[G.i];G.answered=false;
  app.innerHTML=`<h2 class="title">${def.title}</h2>
    <div class="progress">${G.qs.map((_,k)=>`<i class="${k<G.i?'done':k===G.i?'now':''}"></i>`).join('')}</div>
    <div class="card qcard">${def.q(q)}</div><div class="fb" id="fb" aria-live="polite"></div>`;
  def.bind(q);
}
function answer(ok,msg){
  G.answered=true;if(ok){G.right++;addStar()}
  mark($('.qcard'),ok);
  $('#fb').innerHTML=ok?`<div class="row" style="margin-bottom:14px"><button class="btn primary big" id="next">다음 ▶</button></div>`
    :`<div class="fbbox no">${msg}<div class="row"><button class="btn primary" id="next">다음 ▶</button></div></div>`;
  $('#next').onclick=()=>{G.i++;renderGame();window.scrollTo(0,0)};
  $('#fb').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
}
function renderEnd(){
  const n=G.qs.length,subj=SUBJ_OF[G.kind],kind=G.kind;
  app.innerHTML=`<div class="card end"><div class="score" id="score">${G.right} / ${n}</div>
    <h2 class="title">${n}문제 중 ${G.right}개 맞았어요!</h2>
    <p>${G.right===n?'세윤이 최고! 다 맞혔어.':'틀린 건 괜찮아. 한 번 더 하면 더 잘할 수 있어!'}</p>
    <div class="prize" id="prize"></div>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="again">한 번 더</button><button class="btn" data-go="${PARENT[kind]}">목록으로</button></div></div>`;
  if(G.right===n)mark($('#score'),true);
  $('#again').onclick=()=>startGame(kind);
  if(subj)showPrize(subj);
}
async function showPrize(subj){
  const r=await award(subj),el=$('#prize');if(!el)return;const name=Grapes.SUBJ[subj].name;
  el.innerHTML=(r.added?`<p class="giftline" style="color:var(--grape)">🍇 ${name} 포도알을 붙였어요!</p>`
    :r.full?`<p class="giftline">포도송이가 꽉 찼어요! 엄마 아빠에게 보여 주세요 🎁</p>`
    :`<p class="giftline"><small>오늘 ${name} 포도알은 벌써 받았어요. 다른 과목도 해 볼까?</small></p>`)
    +Grapes.svg(r.st.board,r.added?r.st.board.length-1:-1)+`<p class="giftline"><small>${r.st.board.length} / ${Grapes.GOAL}알${r.st.gift?` · 다 채우면 🎁 ${esc(r.st.gift)}`:''}</small></p>`;
}

/* ---------- 받아쓰기 ---------- */
let W={list:shuffle(WRITE),i:0,mode:'listen'};
function renderWrite(){
  const it=W.list[W.i%W.list.length];
  app.innerHTML=`<h2 class="title">받아쓰기</h2>
  <div class="seg"><button data-m="listen">듣고 쓰기</button><button data-m="trace">보고 따라 쓰기</button></div>
  <div class="card">
    <div class="wtop"><span class="qemoji">${it.e}</span><button class="btn primary big" id="say">🔊 들려줘</button></div>
    <div class="boxwrap" id="boxwrap"><div class="boxes${W.mode==='trace'?' tracing':''}" id="boxes">${[...it.t].map(ch=>ch===' '?'<span class="gap"></span>':`<div class="box"><span class="g trace">${ch}</span><canvas></canvas><span class="g ans">${ch}</span></div>`).join('')}</div></div>
    <div class="row"><button class="btn" id="clear">지우기</button><button class="btn primary" id="check">정답 확인</button><button class="btn" id="skip">다음 ▶</button></div>
    <div class="wfb" id="wfb" aria-live="polite"></div>
  </div>`;
  $$('.seg button').forEach(b=>{b.classList.toggle('on',b.dataset.m===W.mode);b.onclick=()=>{W.mode=b.dataset.m;$$('.seg button').forEach(x=>x.classList.toggle('on',x===b));$('#boxes').classList.toggle('tracing',W.mode==='trace')}});
  $('#say').onclick=()=>speak(it.t,.7);
  const n=[...it.t].filter(c=>c!==' ').length,gaps=[...it.t].length-n;
  const cw=$('#boxes').clientWidth;const size=Math.max(70,Math.min(124,Math.floor((cw-(n+gaps-1)*8-gaps*18)/n)));
  $('#boxes').style.setProperty('--bx',size+'px');
  const pads=$$('#boxes canvas').map(cv=>pad(cv,size));
  $('#clear').onclick=()=>{pads.forEach(p=>p());$('#boxes').classList.remove('checked');$('#wfb').innerHTML=''};
  $('#skip').onclick=()=>{W.i++;renderWrite()};
  $('#check').onclick=()=>{
    $('#boxes').classList.add('checked');const snd=soundOf(it.t);
    $('#wfb').innerHTML=`<p class="line">글자: <b>${it.t}</b></p>${snd!==it.t?`<p class="line s">소리: [${snd}]</p>`:''}
      <p>빨간 글자랑 세윤이 글자를 비교해 봐!</p>
      <div class="row"><button class="btn primary" id="good">똑같이 썼어 ★</button><button class="btn" id="retry">다시 써 볼래</button></div>`;
    $('#good').onclick=()=>{addStar();mark($('#boxwrap'),true);$('#wfb').innerHTML='';W.good=(W.good||0)+1;
      if(W.good%5===0)award('han').then(r=>{if(r.added)toastMsg('🍇 받아쓰기 5개! 한글 포도알을 붙였어요')});
      setTimeout(()=>{W.i++;if(CUR==='write')renderWrite()},1300)};
    $('#retry').onclick=()=>$('#clear').click();
  };
}
function toastMsg(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;z-index:50;max-width:90vw;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function pad(cv,size){
  const d=window.devicePixelRatio||1;cv.width=size*d;cv.height=size*d;
  const ctx=cv.getContext('2d');ctx.scale(d,d);
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1D2B45';
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(5,size*.07);ctx.strokeStyle=ink;ctx.fillStyle=ink;
  let on=false,last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*size/r.width,y:(e.clientY-r.top)*size/r.height}};
  cv.addEventListener('pointerdown',e=>{on=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}last=pt(e);ctx.beginPath();ctx.arc(last.x,last.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!on)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){const p=pt(ev);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}e.preventDefault()});
  const end=()=>{on=false};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('pointerleave',end);
  cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  return()=>ctx.clearRect(0,0,size,size);
}

renderHome();
</script>
